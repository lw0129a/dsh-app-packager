name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: CLI smoke test (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          node packages/app-packager/bin/app-packager.mjs init --dir "$RUNNER_TEMP/app-packager-home" --no-wizard
          node packages/app-packager/bin/app-packager.mjs list --dir "$RUNNER_TEMP/app-packager-home"
          node packages/app-packager/bin/app-packager.mjs doctor --dir "$RUNNER_TEMP/app-packager-home" --platform android || true
      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node packages/app-packager/bin/app-packager.mjs init --dir "$env:RUNNER_TEMP\app-packager-home" --no-wizard
          node packages/app-packager/bin/app-packager.mjs list --dir "$env:RUNNER_TEMP\app-packager-home"
          node packages/app-packager/bin/app-packager.mjs doctor --dir "$env:RUNNER_TEMP\app-packager-home" --platform android || true

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r pack --pack-destination "$RUNNER_TEMP/tarballs"
      - run: ls -l "$RUNNER_TEMP/tarballs"
      - name: 校验 tarball（workspace 协议与可执行位）
        run: |
          for t in "$RUNNER_TEMP"/tarballs/*.tgz; do
            if tar -xzOf "$t" package/package.json | grep -q 'workspace:'; then
              echo "::error::$t 的 package.json 仍含 workspace: 协议（npm 不识别，安装会失败）；请用 pnpm pack / pnpm publish 打包"
              exit 1
            fi
          done
          tar -tvzf "$RUNNER_TEMP"/tarballs/lw0129a-app-packager-*.tgz | grep 'engine/打包工具.command' | grep -q '^-rwxr' \
            || { echo "::error::engine/打包工具.command 丢了可执行位"; exit 1; }
