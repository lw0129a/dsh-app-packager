name: Publish

# 用 npm trusted publishing（OIDC）发布：工作流里没有任何 npm token，也不需要人工输验证码。
#
# 一次性前置条件（在 npmjs.com 的包设置里，账号被恢复后做）：
#   app-packager / dsh-app-packager → Settings → Trusted Publisher → GitHub Actions
#   Organization or user = lw0129a、Repository = dsh-app-packager、Workflow filename = publish.yml
# 两个包都要各配一次；配好后这个工作流就能发布，不再走「staged publishing + 人工批准」。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只走一遍打包与鉴权，不真正发布
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # 换取 npm 的 OIDC 身份，trusted publishing 必需

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # 删 tag 也会触发 push 事件；那种运行不该去发布。
    if: ${{ !(github.event_name == 'push' && github.event.deleted) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # npm 11.x；trusted publishing 要求 npm >= 11.5.1
          # 不要加 registry-url：那会写入 _authToken 占位，反而盖掉 OIDC
          node-version: '24'

      - name: 检查 npm 版本与 tag 一致
        run: |
          set -euo pipefail
          v=$(npm --version); major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::npm >= 11.5.1 才支持 trusted publishing，当前 $v"
            exit 1
          fi
          echo "npm $v"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            for p in packages/app-packager packages/dsh-app-packager; do
              have=$(node -p "require('./$p/package.json').version")
              [ "$have" = "$tag" ] \
                || { echo "::error::$p 的版本是 $have，与 tag $GITHUB_REF_NAME 不一致"; exit 1; }
            done
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm -r pack --pack-destination "$RUNNER_TEMP/tarballs"
      - run: ls -l "$RUNNER_TEMP/tarballs"

      - name: 预检 npm trusted publisher
        # `npm publish --dry-run` 在 OIDC 换票失败时仍然退出 0（失败只出现在 verbose 日志里），
        # 于是 dry run 会假装绿色。这里自己换一次票：把「npm 侧没有匹配的 trusted publisher」
        # 变成一条明确的失败并列出要填的字段，而不是让人对着 npm 的 404 猜。
        run: |
          set -euo pipefail
          failed=0
          for dir in packages/app-packager packages/dsh-app-packager; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver 已在 registry 上，不需要换票"
              continue
            fi
            token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
            code=$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name" \
              -H "Authorization: bearer $token")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "$name：trusted publisher 就绪（HTTP $code）"
            else
              echo "::error file=.github/workflows/publish.yml::$name 换票失败 HTTP $code：$(cat "$RUNNER_TEMP/exchange.json")"
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            cat <<'HINT'
          npm 侧没有匹配这个仓库的 trusted publisher。在 npmjs.com 上给每个包各配一次：
            包页面 → Settings / Access → Trusted Publisher → GitHub Actions
            Organization or user: lw0129a
            Repository: dsh-app-packager
            Workflow filename: publish.yml      （只写文件名，不要带路径）
            Environment name: （留空）
            Allowed actions: npm publish
          配好后重跑本工作流即可；已在 registry 上的版本会被自动跳过，所以重跑是安全的。
          HINT
            exit 1
          fi

      - name: 发布（trusted publishing）
        # npm 把 OIDC 换取 token 的失败吞在 verbose 级别里，最终只报一句
        # `ENEEDAUTH need auth`（看不出是「没配 trusted publisher」还是「没给 id-token」）。
        # 打开 verbose 后日志里会多一行 `oidc Failed token exchange request with body message: …`，
        # 那才是真正的原因。
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -euo pipefail
          # 普通变量而不是数组：空数组在 `set -u` + bash 3.2（macOS）下会报 unbound。
          dry=""
          # 注意别写成 `[ cond ] && dry=...`：set -e 下条件不成立会让脚本直接退出
          if [ "${{ inputs.dry_run }}" = "true" ]; then dry="--dry-run"; fi
          # 顺序要紧：插件依赖 CLI，先发 app-packager。
          # 用 [0-9]* 排除根包的 app-packager-monorepo-*.tgz（private，不发布）。
          # 已在 registry 上的版本直接跳过：这样「只发出去一个包」的状态能靠重跑补完，
          # 而不是在 `npm publish` 报「版本已存在」时整体失败。
          publish() {
            local dir=$1 tgz=$2 name ver
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if [ -z "$dry" ] && npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver 已在 registry 上，跳过"
              return 0
            fi
            npm publish $tgz $dry
          }
          publish packages/app-packager "$RUNNER_TEMP"/tarballs/app-packager-[0-9]*.tgz
          publish packages/dsh-app-packager "$RUNNER_TEMP"/tarballs/dsh-app-packager-[0-9]*.tgz

      - name: 回读 registry 版本
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          sleep 15
          for p in app-packager dsh-app-packager; do
            want=$(node -p "require('./packages/$p/package.json').version")
            have=$(npm view "$p" version)
            [ "$have" = "$want" ] \
              || { echo "::error::$p 在 registry 上是 $have，期望 $want"; exit 1; }
            echo "$p@$have 已上线"
          done
