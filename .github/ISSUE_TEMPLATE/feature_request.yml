name: Feature request
description: Suggest a capability for the CLI, the agent tools or the web panel
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project deliberately keeps the bash engine unchanged and the Node layer dependency-free; requests that fit those two constraints land fastest.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI commands and options
        - agent tools (list / doctor / check / build)
        - web panel
        - project discovery and config parsing
        - Windows / Linux bridging
        - packaging engine
        - documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that is painful today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the command, tool or panel do? A sketch of the interface is enough.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, or why the engine's own interface is not enough.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can be done without adding a runtime dependency to the CLI
        - label: This does not require modifying the bash engine (or the engine change is justified)
