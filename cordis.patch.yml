# dsh bundle patch: mount the AppPackager tools.
#
# Every key below is a Config field (Schemastery schema); invalid values fail
# the profile load loudly. Override any of them from your own profile
# cordis.patch.yml by re-inserting the row with id `app-packager`.
- insert:
    - id: app-packager
      name: 'dsh-app-packager'
      config:
        # Engine home. Empty follows APP_PACKAGER_HOME, else <plugin dir>/home.
        # The first time <plugin dir>/home is used, an existing ~/AppPackager is
        # renamed into place so downloads and registered projects move along.
        home: ''
        # Extra directories scanned for uni-app x projects, on top of the
        # engine home's parent directory.
        searchRoots: []
        # Build/check budget. A real iOS/Android/HarmonyOS build takes minutes.
        checkTimeoutMs: 600000
        buildTimeoutMs: 5400000
        # Characters of engine output kept in the tool result (tail).
        outputLimit: 12000
